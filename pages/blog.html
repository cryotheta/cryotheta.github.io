<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasan - Blog</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Knowledge Graph</h1>
            <p class="tagline">Thoughts in Markdown</p>
        </header>

        <div class="content" id="blog-container">
            <!-- Blog posts will be injected here -->
            <p>Loading neural pathways...</p>
        </div>

        <footer>
            <p>&copy; 2026 Hasan Mustafa. Powered by Mathematics.</p>
        </footer>
    </div>

    <!-- FIXED BOTTOM RIGHT NAVIGATION -->
    <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="cv.html">CV</a></li>
            <li><a href="research.html">Research</a></li>
            <li><a href="blog.html" class="active">Blog</a></li>
            <li><a href="more.html">More</a></li>
        </ul>
    </nav>

    <script>
        // Configuration: Inline Markdown to bypass local CORS restrictions
        const posts = [
            {
                id: 'what_is_ml',
                title: 'What is Responsible AI?',
                date: '2026-01-19',
                content: `# What is Responsible AI?

**Date:** 2026-01-19  
**Tags:** AI, Intro, Education

Responsible AI is a field that deals with the ethical and societal implications of AI. It is often mystified as "magic" or "robot intelligence", but at its core, it is simply **statistics on steroids**.

Stay tuned for more deep dives!`
            }
        ];

        function loadPosts() {
            const container = document.getElementById('blog-container');
            container.innerHTML = ''; // Clear loading text

            posts.forEach(post => {
                const htmlContent = marked.parse(post.content);

                // Create Post Element
                const postDiv = document.createElement('div');
                postDiv.className = 'blog-post';

                // Extract first paragraph for preview
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = htmlContent;
                const previewText = tempDiv.querySelector('p') ? tempDiv.querySelector('p').innerText : 'Read more...';

                postDiv.innerHTML = `
                    <h3><a href="#" onclick="viewPost('${post.id}'); return false;">${post.title}</a></h3>
                    <p class="blog-date">[ ${post.date} ]</p>
                    <p>${previewText.substring(0, 150)}...</p>
                `;

                container.appendChild(postDiv);
            });
        }

        function viewPost(postId) {
            const container = document.getElementById('blog-container');
            const post = posts.find(p => p.id === postId);

            if (!post) {
                container.innerHTML = '<p>Error: Data corrupted.</p>';
                return;
            }

            const htmlContent = marked.parse(post.content);

            container.innerHTML = `
                <div style="margin-bottom:20px;">
                    <a href="#" onclick="location.reload(); return false;" style="color: var(--cyan);"><< Back to Index</a>
                </div>
                <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px;">
                    ${htmlContent}
                </div>
            `;
        }

        // Initialize
        loadPosts();
    </script>
</body>

</html>
